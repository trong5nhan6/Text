# TF-IDF (char_wb 2-5 + word 1-2) + MLP. Same features as tfidf.yaml; the classifier is a small
# neural net instead of a linear model, so it can learn n-grams that only matter together.
# CPU only. Run name: tfidf_mlp.
#   python train.py --config configs/tfidf_mlp.yaml --task b
_base_: tfidf.yaml
model:
  clf: mlp
  # L2 penalty grid; the best is picked by held-out macro-F1, like C/alpha for the other clfs.
  param_grid: [1.0e-4, 1.0e-3, 1.0e-2]
  mlp_hidden: [256]         # hidden layer widths, e.g. [256] or [512, 128]
  mlp_lr: 1.0e-3            # Adam learning rate
  mlp_batch_size: 64
  mlp_max_iter: 100         # max epochs; early stopping on 10% of the fit slice usually stops sooner
  mlp_patience: 5           # epochs without improvement on that 10% before stopping
  # The first layer is (number of TF-IDF features) x mlp_hidden[0] dense weights, so this cap is
  # what bounds the memory: 50k char features + the word vocabulary, x 256.
  max_features: 50000
