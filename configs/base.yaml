# Shared defaults. Every model config starts with `_base_: base.yaml` and overrides what it needs.
# Any key can also be overridden from the CLI:  --set training.lr=1e-5 data.max_len=128
task: a                     # a = Hate / Non-Hate, b = 6 hate categories (overridable with --task)
seed: 42
run_name: null              # default: <config>_<loss>_s<seed>  (tfidf: <config>_<clf>)

paths:
  raw_dir: data/raw         # organiser CSVs (+ *test*.csv once released)
  processed_dir: data/processed
  results_dir: results
  checkpoint_dir: checkpoints
  log_dir: logs

data:
  # Which view of the comment the model sees. `text` is the cleaned Kanglish (Latin script),
  # `text_kn` the same comment in Kannada script (data/xlit_kn.json).
  #   null / latin  only text                        (default)
  #   kn            only text_kn
  #   en            only text_en -- the machine translation (data/mt_en.json). An ablation arm:
  #                 NLLB sanitises slurs, literalises them (`Dagar` -> "dagger") and hallucinates
  #                 (`Husulimaga`, a slur, -> "What is the meaning of life?"), with 2.4% of the
  #                 cache degenerating into repetition. It destroys the surface features this
  #                 task turns on, so measure it once rather than expecting a gain.
  #   both          both -- tfidf: one set of features per column, on the same row;
  #                         transformer: the Kannada copy added as extra training rows
  # The run name gains _kn / _both, so the three land in separate results/ folders.
  text_type: null
  # Test-time augmentation, TRANSFORMERS ONLY: predict each row through both scripts and
  # average the probabilities. The eval rows do not change, so the score stays comparable with
  # every other run; it costs one extra forward pass and the run name gains _tta.
  # Rejected for tfidf, where the two scripts share no n-grams and the second view is empty.
  tta: null
  # false fits on every labelled row instead of holding 10% back. Only for the final model you
  # intend to submit, and only after an ordinary run has settled the epoch count: without the
  # held-out slice a run cannot pick its best epoch (it keeps the LAST one), cannot stop early,
  # writes no eval.npy, gets no score in metrics.csv, and is excluded from every blend. It still
  # writes val.npy / test.npy, so the submission files are produced as usual. The run name gains
  # _full so it can never share a directory with the 90% version.
  # null and true both mean "hold the slice back" -- the default, and what every finished run did.
  use_valdataset: null
  val_ratio: 0.1            # one 90/10 split: fit on 90%, score on the held-out 10%
  split_seed: 42            # keep fixed -> every run shares the split, so runs can be blended
  max_len: 96               # 95% of comments < 35 words

model:
  type: transformer         # transformer | tfidf
  name: google/muril-base-cased
  pooling: cls              # cls | mean | last
                            # `last` = token cuoi khong phai padding. BAT BUOC cho LLM giai ma:
                            # attention nhan qua khien vi tri 0 chi thay chinh no, nen `cls` se
                            # doc token BOS va vut ca cau di -- khong bao loi, chi ra diem thap.
  dtype: null               # null = nap roi .float() (giu nguyen moi run cu)
                            # fp16 | bf16: BAT BUOC cho LLM. Ban sao fp32 chi co ich khi trong
                            # so nhan gradient; nen LoRA thi no chi nhan doi bo nho vo ich --
                            # sarvam-1 la 9,64 GB fp32 so voi 4,82 fp16, ma T4 co 14,56.
  dropout: 0.1
  multisample_dropout: null # null/1 = nhu cu. 4-8 = chay head qua nhieu mat na dropout roi
                            # trung binh logit. Gan nhu mien phi: chi head chay lai, khong phai
                            # encoder. Chi tac dung luc train.
  # Partial fine-tuning. null keeps today's behaviour (everything trains).
  #   4 -> only the last 4 transformer blocks (+ the head and the norms above them)
  #   0 -> the whole backbone frozen, head only (linear probing)
  # Blocks are found from the parameter names, so this works for ModernBERT's 22 `layers.{i}`
  # as well as the 12 `encoder.layer.{i}` of the BERT family.
  unfreeze_last_n_blocks: null
  freeze_embeddings: null   # null = follow unfreeze_last_n_blocks | true | false

  # Classification head.  linear = 768 -> n_labels, what every finished run used.
  #   sparse_moe  top-k routed mixture of MLP experts on the pooled vector (Shazeer 2017)
  #   soft_moe    Soft MoE over the TOKEN sequence (Puigcerver 2023) -- it aggregates the tokens
  #               itself, so `pooling` above is ignored when this head is selected
  # Size check before turning these on: the linear head is 4,614 params, a 4-expert MoE with
  # expert_dim 64 is ~201k, fitted on 2.8k-5.7k rows by a model that already reaches train-F1
  # 0.99. More head capacity is not what the held-out gap is short of.
  # Which hidden states the head reads. forward() uses only the last one by default, but a
  # frozen-feature probe on MuRIL says the shallow layers carry more: on task b a linear probe
  # scores 0.4208 on layer 12, 0.4582 on layer 2, and 0.4791 on the two concatenated. On task a
  # layer 2 alone wins (0.7507 vs 0.7350) while concatenating loses, so this is task-dependent.
  #   null      only last_hidden_state -- unchanged behaviour, no extra parameters
  #   [2, 12]   concatenate these hidden states; the head input doubles to 1536
  #   mix       one learned softmax weight per hidden state, summed. Width stays 768 and it
  #             costs 13 parameters; model.layer_mix() reports what it learned.
  # Indices run 0 (embedding output, no block applied) .. num_hidden_layers (= last_hidden_state).
  # Careful with a single shallow layer: layers: [2] leaves blocks 3-12 with no path to the loss,
  # so they get no gradient and the model is a 2-block transformer paying for 12.
  layers: null
  head: linear              # linear | mlp | sparse_moe | soft_moe
  mlp_dims: [512]           # CHI head=mlp: be rong cac tang an, vd [512] hoac [512, 128]
  mlp_dropout: 0.2          # CHI head=mlp: dropout sau moi tang an
  # Hybrid: TF-IDF (char 2-5 + word 1-2, of the text and of its phonetic key) chieu xuong
  # hybrid_dim roi GHEP vao vector pooled truoc head -- mot model, hoc chung, khac voi blend
  # (trung binh xac suat cua cac model train rieng). Featurizer fit tren lat fit cua run, luu
  # kem checkpoint (tfidf.pkl). Ten run them _hyb. Chi voi text_type=latin, khong tta.
  # Side embedding: BAT/TAT bang mot khoa. Tron them mot vector muc TU vao embedding dau vao
  # cua encoder:  e = e_subword + gate * e_side  (gate khoi tao 0 -> buoc dau = model goc).
  #   null           tat (mac dinh, moi run cu)
  #   char           CharCNN tren ky tu cua tu (emoji, bien the chinh ta)
  #   phonetic       embedding cua khoa phien am (thu/thuu/thoo -> 1 dong)
  #   char+phonetic  ca hai
  # 1 encoder duy nhat; vector cua tu duoc chep len moi subword cua tu do theo word_ids().
  # Ten run them _se-<kieu>. Can tokenizer fast (khong dung voi CANINE), text_type=latin, khong tta.
  side_embedding: null
  # Embedding mix: BAT/TAT bang mot khoa. 1 tokenizer (cua encoder) -> tron bang word embedding
  # cua NHIEU checkpoint -> 1 encoder:   e = E_0[id] + sum_k a_k * (E_k[id] - E_0[id])
  #   E_0 = bang cua encoder (model.name, van duoc train); E_k = bang cua nguon k (DONG BANG).
  #   a_k khoi tao 0 -> buoc dau = model goc.
  # Nguon phai DUNG CHUNG VOCAB voi encoder (row i = token i o ca hai), vd voi cnerg_muril:
  #   [google/muril-base-cased, checkpoints/mlm/muril-base-cased]
  # mBERT / XLM-R bi tu choi: tokenizer MuRIL chi khop ~80% token voi chung, va phan truot la
  # chinh tu Kanglish. Ten run them _mix-<nguon>. Moi bang +0.3 GB (fp16) tren GPU va checkpoint.
  embed_mix: null           # null | ten/duong dan checkpoint | danh sach nhieu nguon
  embed_mix_mode: token     # CHI embed_mix: token = moi token co trong so rieng (router)
                            #                global = 1 trong so chung cho moi nguon
  embed_mix_lr: 1.0e-3      # CHI embed_mix: lr cua router / trong so tron
  side_char_dim: 32         # CHI side: so chieu embedding moi ky tu
  side_char_filters: 64     # CHI side: so filter moi do rong CNN (2,3,4,5) -> vector ky tu 4x
  side_key_dim: 128         # CHI side: so chieu embedding khoa phien am
  side_min_count: 2         # CHI side: khoa phien am xuat hien it hon so nay -> dung chung dong UNK
  side_max_word_len: 20     # CHI side: cat tu dai hon so ky tu nay
  side_dropout: 0.1         # CHI side: dropout truoc phep chieu len hidden
  side_lr: 1.0e-3           # CHI side: lr cua nhanh phu + gate (khoi tao moi)
  hybrid: null              # null | tfidf
  hybrid_dim: 256
  hybrid_dropout: 0.3       # dropout tren vector TF-IDF dau vao: phep chieu co ~80k x 256 trong so
  hybrid_lr: 1.0e-3         # nhanh moi khoi tao, dau vao thua ~0.1 -> can lr lon hon head_lr
  hybrid_max_features: 20000   # SO CHIEU TF-IDF: tran cho MOI vectoriser. Co 4 vectoriser
                               # (char/word x text/phien am) -> tong toi da 4 x gia tri nay
                               # (80k); 2 x neu hybrid_phonetic=false. null = khong gioi han
  hybrid_phonetic: true     # them view phien am: +0.002 (a) / +0.013 (b) voi LR, 5-fold
  moe_experts: 4            # both MoE heads
  moe_expert_dim: 64        # hidden width of one expert MLP; 64 -> ~201k, 256 -> ~797k
  moe_top_k: 2              # sparse_moe only: experts active per example (1 = Switch routing)
  moe_slots: 1              # soft_moe only: slots per expert
  moe_dropout: 0.1          # inside each expert

training:
  epochs: 20                 # also the LR schedule length: warmup 10% then linear decay to 0 at
                            # the last step, so this must stay close to where training converges.
                            # Fine-tuning on 2.8k-5.7k rows peaks at 2-4 epochs; at 30 the LR never
                            # annealed and every epoch past ~3 was noise.
  batch_size: 32            # standard pairing with lr 2e-5
  eval_batch_size: 64
  grad_accum: 1
  lr: 2.0e-5
  head_lr: 1.0e-4           # classifier head is trained from scratch
  layer_mix_lr: 1.0e-3      # only model.layers=mix: learning rate of the 13 softmax logits.
                            # Much larger than head_lr on purpose -- AdamW steps a parameter by
                            # about its lr regardless of gradient size, so at 1e-4 the mix is
                            # still uniform to four decimals after a full epoch.
  llrd: null                # layer-wise LR decay. null = one flat lr for the whole backbone.
                            # 0.9 = each block gets 0.9x the LR of the block above it, so the
                            # last block trains at `lr` and block 0 at lr*0.9**12. Keeps the
                            # lower blocks' multilingual features from being overwritten on
                            # 3k-6k rows. Try 0.95 (gentle) .. 0.85 (strong). Head keeps head_lr.
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: auto           # auto | fp32 | fp16 | bf16
  num_workers: 2
  grad_checkpointing: null  # tinh lai kich hoat luc backward thay vi giu chung: giam bo nho
                            # kich hoat khoang sqrt(so tang), doi lai cham hon ~30%. Can cho
                            # model 7B tren T4; model nho thi khong can.
  single_gpu: null          # null/false = dung MOI GPU nhin thay (DataParallel); true = chi 1.
                            # Voi nhieu GPU, batch_size la TONG chia deu cho chung. Head
                            # sparse_moe tu dong quay ve 1 GPU: DataParallel chay forward tren
                            # ban sao, nen aux_loss ghi vao ban sao roi mat, va router se sup ve
                            # mot expert ma khong bao loi nao.
  loss: auto                # auto (a: ce, b: focal) | ce | wce | focal
  class_weight: sqrt_inv    # none | inverse | sqrt_inv  (used by wce / focal)
  focal_gamma: 2.0
  moe_aux_weight: 0.01      # sparse_moe only: weight of the load-balancing loss. 0 disables it,
                            # and the router then collapses onto one expert within a few hundred
                            # steps -- which shows up as a mediocre score, never as an error.
  label_smoothing: 0.0
  # Chong overfit. Moi ho model thu o day deu overfit giong nhau: train F1 len 0,98 trong khi
  # eval tut tu 0,80 xuong 0,76. Trong so mac dinh (dropout 0,1 + weight_decay 0,01) la tat ca
  # nhung gi dang chong lai no.
  fgm: null                 # adversarial training: 1.0 la buoc chuan. Nhieu loan embedding theo
                            # huong gradient roi chay lai -> model dung tren CA MOT VUNG chu
                            # khong chi mot diem. Tra gia: moi buoc chay 2 lan forward.
                            # KHONG dung duoc khi freeze_embeddings hoac LoRA (embedding dong
                            # bang thi khong co gi de nhieu loan) -- trainer se bao va bo qua.
  ema: null                 # trung binh truot cua trong so, 0.999 la chuan. Gan nhu mien phi.
                            # Epoch cuoi cua SGD tren du lieu it la nay quanh cuc tieu; trung
                            # binh cac vi tri do tong quat hoa tot hon bat ky vi tri nao.
  early_stopping_patience: 3   # >= epochs on purpose: run the full schedule so the LR anneals,
                              # and keep the best epoch's weights. Stopping early would cut the
                              # anneal short, which is where most of the gain is.

checkpoint:
  save: best                # best | none   (best = best epoch of every fold)
  half: true                # store weights in fp16 -> half the disk (~0.5 GB / fold for base models)
