# Shared defaults. Every model config starts with `_base_: base.yaml` and overrides what it needs.
# Any key can also be overridden from the CLI:  --set training.lr=1e-5 data.max_len=128
task: a                     # a = Hate / Non-Hate, b = 6 hate categories (overridable with --task)
seed: 42
run_name: null              # default: <config>_<loss>_s<seed>  (tfidf: <config>_<clf>)

paths:
  raw_dir: data/raw         # organiser CSVs (+ *test*.csv once released)
  processed_dir: data/processed
  results_dir: results
  checkpoint_dir: checkpoints
  log_dir: logs

data:
  # Which view of the comment the model sees. `text` is the cleaned Kanglish (Latin script),
  # `text_kn` the same comment in Kannada script (data/xlit_kn.json).
  #   null / latin  only text                        (default)
  #   kn            only text_kn
  #   both          both -- tfidf: one set of features per column, on the same row;
  #                         transformer: the Kannada copy added as extra training rows
  # The run name gains _kn / _both, so the three land in separate results/ folders.
  text_type: null
  # Test-time augmentation, TRANSFORMERS ONLY: predict each row through both scripts and
  # average the probabilities. The eval rows do not change, so the score stays comparable with
  # every other run; it costs one extra forward pass and the run name gains _tta.
  # Rejected for tfidf, where the two scripts share no n-grams and the second view is empty.
  tta: null
  val_ratio: 0.1            # one 90/10 split: fit on 90%, score on the held-out 10%
  split_seed: 42            # keep fixed -> every run shares the split, so runs can be blended
  max_len: 96               # 95% of comments < 35 words

model:
  type: transformer         # transformer | tfidf
  name: google/muril-base-cased
  pooling: cls              # cls | mean
  dropout: 0.1
  # Partial fine-tuning. null keeps today's behaviour (everything trains).
  #   4 -> only the last 4 transformer blocks (+ the head and the norms above them)
  #   0 -> the whole backbone frozen, head only (linear probing)
  # Blocks are found from the parameter names, so this works for ModernBERT's 22 `layers.{i}`
  # as well as the 12 `encoder.layer.{i}` of the BERT family.
  unfreeze_last_n_blocks: null
  freeze_embeddings: null   # null = follow unfreeze_last_n_blocks | true | false

training:
  epochs: 20                 # also the LR schedule length: warmup 10% then linear decay to 0 at
                            # the last step, so this must stay close to where training converges.
                            # Fine-tuning on 2.8k-5.7k rows peaks at 2-4 epochs; at 30 the LR never
                            # annealed and every epoch past ~3 was noise.
  batch_size: 32            # standard pairing with lr 2e-5
  eval_batch_size: 64
  grad_accum: 1
  lr: 2.0e-5
  head_lr: 1.0e-4           # classifier head is trained from scratch
  llrd: null                # layer-wise LR decay. null = one flat lr for the whole backbone.
                            # 0.9 = each block gets 0.9x the LR of the block above it, so the
                            # last block trains at `lr` and block 0 at lr*0.9**12. Keeps the
                            # lower blocks' multilingual features from being overwritten on
                            # 3k-6k rows. Try 0.95 (gentle) .. 0.85 (strong). Head keeps head_lr.
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: auto           # auto | fp32 | fp16 | bf16
  num_workers: 2
  loss: auto                # auto (a: ce, b: focal) | ce | wce | focal
  class_weight: sqrt_inv    # none | inverse | sqrt_inv  (used by wce / focal)
  focal_gamma: 2.0
  label_smoothing: 0.0
  early_stopping_patience: 3   # >= epochs on purpose: run the full schedule so the LR anneals,
                              # and keep the best epoch's weights. Stopping early would cut the
                              # anneal short, which is where most of the gain is.

checkpoint:
  save: best                # best | none   (best = best epoch of every fold)
  half: true                # store weights in fp16 -> half the disk (~0.5 GB / fold for base models)
